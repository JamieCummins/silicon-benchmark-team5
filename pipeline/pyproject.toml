[project]
name = "silicon"
version = "0.1.0"
description = "team_5 pipeline for the Silicon Sample Benchmark"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60",
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.14",
    "tenacity>=9.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/silicon"]
